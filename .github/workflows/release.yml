name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Rilancia un tag il cui run è fallito, senza spostarlo. Scegli il tag come
  # ref quando lanci il dispatch.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-release:
    uses: Scrapkit/ci-pipeline/.github/workflows/github-release.yml@v1
